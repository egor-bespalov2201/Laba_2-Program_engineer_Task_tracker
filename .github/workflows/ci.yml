name: CI Task Tracker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Python version
        run: py --version

      - name: Run unit tests
        run: py -m unittest discover -v -s

      - name: Launch project in demo mode
        run: |
          chcp 65001
          py main.py
